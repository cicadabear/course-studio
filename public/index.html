<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6b00"><meta name="description" content="自己的课程，随时接着听。">
<title>知行 · 我的课程</title><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="stylesheet" href="/styles.css?build=20261025-player-rollback">
</head>
<body>
<header class="header"><div class="header-inner"><a class="brand" href="#courses"><img src="/icon.svg" alt=""><span>知行<small>我的课程</small></span></a><nav class="desktop-nav" aria-label="主导航"><a href="#courses" data-nav="courses">课程列表</a><a href="#youth" data-nav="youth">少年课程</a><a href="#learning" data-nav="learning">我的</a></nav><button id="account" class="account" aria-label="登录或账户">登录 / 注册</button></div></header>
<main id="main" tabindex="-1"><div class="loading">正在打开你的课程…</div></main>
<nav class="mobile-nav" aria-label="手机导航"><a href="#courses" data-nav="courses"><span data-icon="grid"></span>课程列表</a><a href="#youth" data-nav="youth"><span data-icon="youth"></span>少年课程</a><a href="#learning" data-nav="learning"><span data-icon="user"></span>我的</a></nav>
<div id="mini-player" class="mini-player hidden"><button id="mini-info" class="mini-info"><span id="mini-cover"></span><span class="mini-titles"><strong id="mini-title"></strong><small id="mini-course"></small></span></button><button id="mini-play" class="icon-button" aria-label="播放 / 暂停"></button><button id="mini-queue" class="icon-button" aria-label="播放队列"></button><div class="mini-progress"><span id="mini-progress-fill"></span></div></div>
<audio id="audio" preload="auto" playsinline webkit-playsinline></audio>
<dialog id="auth-dialog" class="auth-dialog"><form id="auth-form"><button type="button" class="close-dialog icon-button" data-close="auth-dialog" aria-label="关闭">×</button><img class="auth-logo" src="/icon.svg" alt=""><h2 id="auth-title">欢迎回来</h2><p id="auth-subtitle">登录后，继续上次的学习</p><label>用户名<input id="username" name="username" autocomplete="username" minlength="2" maxlength="32" placeholder="你的用户名" required></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="至少 8 位" required></label><p id="auth-error" class="error" role="alert"></p><button id="auth-submit" class="primary wide">登录</button><button id="auth-switch" type="button" class="text-button wide">没有账号？注册一个</button></form></dialog>
<dialog id="account-dialog" class="auth-dialog"><button class="close-dialog icon-button" data-close="account-dialog" aria-label="关闭">×</button><h2 id="account-name"></h2><p>学习进度随账号保存</p><button id="logout" class="primary wide">退出登录</button></dialog>
<dialog id="player-dialog" class="player-dialog" aria-labelledby="player-title"><div id="player-favorite" class="player-favorite"></div><button class="close-dialog icon-button" data-close="player-dialog" aria-label="收起播放器"></button><p id="playback-label" class="eyebrow">正在学习</p><div id="player-cover" class="player-cover"></div><p id="player-course" class="muted"></p><h2 id="player-title" tabindex="-1" autofocus></h2><div id="save-status" class="save-status" aria-live="polite">播放进度自动保存</div><div class="seek"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><div class="times"><span id="time-current">00:00</span><span id="time-total">00:00</span></div></div><div class="transport"><button id="previous" class="icon-button" aria-label="上一讲"></button><button id="backward" class="skip" aria-label="后退 15 秒"></button><button id="play-toggle" class="big-play" aria-label="播放 / 暂停"></button><button id="forward" class="skip" aria-label="前进 15 秒"></button><button id="next" class="icon-button" aria-label="下一讲"></button></div><div class="player-options"><label>倍速<select id="rate" aria-label="播放倍速"><option value="0.75">0.75×</option><option value="1">1.0×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2.0×</option></select></label><button id="sleep" class="sleep-control" aria-expanded="false" aria-controls="sleep-dialog"><span class="sleep-icon"></span><span id="sleep-label">定时</span></button><button id="open-queue" class="text-button">播放队列</button><button id="open-transcript" class="text-button hidden">文稿跟随</button><button id="player-pdf" class="text-button">阅读文稿</button></div><label class="autonext"><input id="autonext" type="checkbox" checked> 自动播放下一讲</label><button id="player-complete" class="text-button complete-button">标记已完成</button></dialog>
<dialog id="sleep-dialog" class="sleep-dialog"><div class="dialog-heading"><div><p class="eyebrow">定时停止播放</p><h2 id="sleep-heading">选择停止播放的时间</h2></div><button class="icon-button" data-close="sleep-dialog" aria-label="关闭">×</button></div><div id="sleep-rows"></div><button id="sleep-close" class="sleep-close" data-close="sleep-dialog">关闭</button></dialog>
<dialog id="queue-dialog" class="queue-dialog"><div class="dialog-heading"><div><p class="eyebrow">本课程专属</p><h2>播放队列 <span id="queue-count"></span></h2></div><button class="icon-button" data-close="queue-dialog" aria-label="关闭">×</button></div><p id="queue-description" class="muted"></p><div class="queue-tools"><button id="queue-reset" class="text-button">恢复课程顺序</button><button id="queue-unfinished" class="text-button">只听未完成</button></div><div id="queue-items"></div><button id="queue-more" class="text-button wide hidden">显示更多</button></dialog>
<div id="toast" role="status" class="toast hidden"></div>
<script src="/app.js?build=20261025-player-rollback" type="module"></script>
</body></html>
